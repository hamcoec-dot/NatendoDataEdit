[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.3.7"
edition = "2021"
license = "UNLICENSED"
authors = ["Natendo"]
rust-version = "1.82"

[workspace.dependencies]
natendo-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Integer overflow panics instead of wrapping, even in release builds.
overflow-checks = true
codegen-units = 1
lto = "thin"

# The scramble stretches its phrase with 600,000 SHA-256 rounds; keep that
# quick in test builds too.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3
