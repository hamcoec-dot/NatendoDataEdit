<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Natendo Data Edit app icon: a 3x3 grid of cells with the active cell highlighted. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26907f"/>
      <stop offset="1" stop-color="#17675b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <g fill="#ffffff">
    <rect x="40" y="40" width="52" height="52" rx="10" opacity=".95"/>
    <rect x="102" y="40" width="52" height="52" rx="10" opacity=".95"/>
    <rect x="164" y="40" width="52" height="52" rx="10" opacity=".95"/>
    <rect x="40" y="102" width="52" height="52" rx="10" opacity=".55"/>
    <rect x="164" y="102" width="52" height="52" rx="10" opacity=".55"/>
    <rect x="40" y="164" width="52" height="52" rx="10" opacity=".55"/>
    <rect x="102" y="164" width="52" height="52" rx="10" opacity=".55"/>
    <rect x="164" y="164" width="52" height="52" rx="10" opacity=".55"/>
  </g>
  <rect x="100" y="100" width="56" height="56" rx="12" fill="#ffc94a" stroke="#ffffff" stroke-width="6"/>
</svg>
